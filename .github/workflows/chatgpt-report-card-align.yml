name: ChatGPT report card alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-report-card-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused report card layout change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/report_screen.dart')
          text = path.read_text()
          old = "    final text = AppTextScope.of(context);\n    final hasTrailingActions = onAction != null || onApproval != null;\n    return Material("
          new = "    final text = AppTextScope.of(context);\n    return Material("
          if old not in text:
              raise SystemExit('Expected trailing-action declaration not found')
          text = text.replace(old, new, 1)
          old = "              Padding(\n                padding: EdgeInsets.only(right: hasTrailingActions ? 56 : 0),\n                child: Column(\n                  crossAxisAlignment: CrossAxisAlignment.start,\n                  children: [\n                    Row("
          new = "              Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: [\n                  Padding(\n                    padding: EdgeInsets.only(right: onAction != null ? 56 : 0),\n                    child: Row("
          if old not in text:
              raise SystemExit('Expected card-wide padding block not found')
          text = text.replace(old, new, 1)
          old = "                      ],\n                    ),\n                    const SizedBox(height: 16),"
          new = "                      ],\n                    ),\n                  ),\n                  const SizedBox(height: 16),"
          if old not in text:
              raise SystemExit('Expected report header closing not found')
          text = text.replace(old, new, 1)
          old = "                    ),\n                  ],\n                ),\n              ),\n              if (onAction != null)"
          new = "                    ),\n                  ],\n                ),\n              if (onAction != null)"
          if old not in text:
              raise SystemExit('Expected outer padding closing not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name 'chatgpt-bot'
          git config user.email 'chatgpt-bot@users.noreply.github.com'
          git rm .github/workflows/chatgpt-report-card-align.yml
          git add lib/screens/report_screen.dart
          git commit -m 'chatgpt: align report card metrics'
          git push origin HEAD:main
