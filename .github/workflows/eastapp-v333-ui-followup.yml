name: Apply EastApp v333 task UI follow-up

on:
  push:
    branches:
      - frontend-v333-task-home-intelligence
    paths:
      - '.github/workflows/eastapp-v333-ui-followup.yml'

permissions:
  contents: write

jobs:
  apply-ui-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-v333-task-home-intelligence

      - name: Apply focused UI edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected pattern: {label}')
              return text.replace(old, new, 1)

          # Home: remove the Approvals shortcut entirely.
          path = Path('lib/screens/home_screen.dart')
          text = path.read_text()
          text = replace_once(text, '  final VoidCallback onApprovals;\n', '', 'home approvals field')
          text = replace_once(text, '    required this.onApprovals,\n', '', 'home approvals constructor')
          text = replace_once(
              text,
              """            if (isManagement)\n              _ActionTile(\n                label: text.t('Approvals'),\n                icon: Icons.fact_check_outlined,\n                colour: AppColours.blueSoft,\n                onTap: widget.onApprovals,\n              ),\n""",
              '',
              'home approvals tile',
          )
          path.write_text(text)

          # Main shell: remove now-dead Home approvals wiring and make one subtle
          # entrance transition common to every main tab.
          path = Path('lib/screens/main_shell.dart')
          text = path.read_text()
          text = replace_once(text, '              onApprovals: openStockReviewFromHome,\n', '', 'home approvals wiring')
          text = replace_once(
              text,
              """  void openStockReviewFromHome() {\n    AppFeedback.select();\n    setState(() {\n      pageSlideDirection = 1;\n      requestedStockPage = StockPage.review;\n      requestedStockPageBackToHome = true;\n      selectedIndex = 2;\n    });\n  }\n\n""",
              '',
              'home approvals navigation helper',
          )
          text = replace_once(
              text,
              """                Expanded(\n                  child: KeyedSubtree(\n                    key: ValueKey<int>(selectedIndex),\n                    child: pages[selectedIndex],\n                  ),\n                ),\n""",
              """                Expanded(\n                  child: AnimatedSwitcher(\n                    duration: const Duration(milliseconds: 220),\n                    switchInCurve: Curves.easeOutCubic,\n                    switchOutCurve: Curves.easeOutCubic,\n                    transitionBuilder: (child, animation) {\n                      final slide = Tween<Offset>(\n                        begin: Offset(\n                          pageSlideDirection >= 0 ? .018 : -.018,\n                          0,\n                        ),\n                        end: Offset.zero,\n                      ).animate(\n                        CurvedAnimation(\n                          parent: animation,\n                          curve: Curves.easeOutCubic,\n                        ),\n                      );\n                      return FadeTransition(\n                        opacity: animation,\n                        child: SlideTransition(\n                          position: slide,\n                          child: child,\n                        ),\n                      );\n                    },\n                    child: KeyedSubtree(\n                      key: ValueKey<int>(selectedIndex),\n                      child: pages[selectedIndex],\n                    ),\n                  ),\n                ),\n""",
              'shared main-tab transition',
          )
          path.write_text(text)

          # Task hub: keep the stagger as a light fade only. The large 18px vertical
          # translation was the visible jump; movement is now handled consistently
          # by the main-tab transition above.
          path = Path('lib/screens/task_hub_screen.dart')
          text = path.read_text()
          text = replace_once(
              text,
              """    return TweenAnimationBuilder<double>(\n      tween: Tween(begin: 0, end: 1),\n      duration: Duration(milliseconds: 480 + delay),\n      curve: Curves.easeOutCubic,\n      builder: (_, value, child) => Opacity(\n        opacity: value,\n        child: Transform.translate(\n          offset: Offset(0, 18 * (1 - value)),\n          child: child,\n        ),\n      ),\n      child: child,\n    );\n""",
              """    return TweenAnimationBuilder<double>(\n      tween: Tween(begin: 0, end: 1),\n      duration: Duration(milliseconds: 180 + delay ~/ 3),\n      curve: Curves.easeOutCubic,\n      builder: (_, value, child) => Opacity(\n        opacity: value,\n        child: child,\n      ),\n      child: child,\n    );\n""",
              'task hub stagger motion',
          )
          path.write_text(text)

          # Active Task: user-controlled 1-10 limit, explicit load only, no Tag
          # filter, and a compact filter card.
          path = Path('lib/screens/tasks_screen.dart')
          text = path.read_text()
          text = replace_once(
              text,
              '  String? selectedTagId;\n  List<TaskRecord> records = const [];\n',
              '  String? selectedTagId;\n  int loadLimit = 3;\n  List<TaskRecord> records = const [];\n',
              'active task load limit state',
          )
          text = replace_once(
              text,
              """      } else if (requestedTab == 1) {\n        result = await widget.api.taskRecords(\n          tenantId: widget.tenantId,\n          tagId: tagId,\n          upcoming: true,\n          limit: 3,\n          forceRefresh: forceRefresh,\n        );\n""",
              """      } else if (requestedTab == 1) {\n        result = await widget.api.taskRecords(\n          tenantId: widget.tenantId,\n          upcoming: true,\n          limit: tab.loadLimit,\n          forceRefresh: forceRefresh,\n        );\n""",
              'active task API limit',
          )
          text = replace_once(
              text,
              """  Future<void> changeTab(int index) async {\n    if (selectedTab == index) return;\n    var shouldAutomaticallyLoad = false;\n    setState(() {\n      selectedTab = index;\n      if (index == 1) {\n        shouldAutomaticallyLoad = true;\n      }\n    });\n    if (shouldAutomaticallyLoad) await loadRecords(tabIndex: index);\n  }\n""",
              """  Future<void> changeTab(int index) async {\n    if (selectedTab == index) return;\n    setState(() => selectedTab = index);\n  }\n""",
              'active task explicit loading',
          )
          text = replace_once(
              text,
              """          _TaskFilterCard(\n            selectedRange: tab.selectedRange,\n            activeTasks: showingActiveTasks,\n            selectedStatus: tab.selectedStatus,\n""",
              """          _TaskFilterCard(\n            selectedRange: tab.selectedRange,\n            activeTasks: showingActiveTasks,\n            loadLimit: tab.loadLimit,\n            selectedStatus: tab.selectedStatus,\n""",
              'task filter loadLimit argument',
          )
          text = replace_once(
              text,
              """            onStatus: (value) => setState(() {\n              tab.selectedStatus = value;\n              clearLoadedRecords(tab);\n            }),\n            onTag: (value) => setState(() {\n""",
              """            onStatus: (value) => setState(() {\n              tab.selectedStatus = value;\n              clearLoadedRecords(tab);\n            }),\n            onLoadLimit: (value) => setState(() {\n              tab.loadLimit = value;\n              clearLoadedRecords(tab);\n            }),\n            onTag: (value) => setState(() {\n""",
              'task filter load limit callback',
          )
          text = replace_once(
              text,
              "? 'Tap Load Tasks to load the next 3 pending Tasks.'\n",
              "? 'Choose how many Tasks to load, then tap Load.'\n",
              'active task empty guidance',
          )
          text = replace_once(
              text,
              """  final bool activeTasks;\n  final TaskStatus? selectedStatus;\n""",
              """  final bool activeTasks;\n  final int loadLimit;\n  final TaskStatus? selectedStatus;\n""",
              'task filter loadLimit field',
          )
          text = replace_once(
              text,
              """  final VoidCallback onDateRange;\n  final ValueChanged<TaskStatus?> onStatus;\n  final ValueChanged<String?> onTag;\n""",
              """  final VoidCallback onDateRange;\n  final ValueChanged<TaskStatus?> onStatus;\n  final ValueChanged<int> onLoadLimit;\n  final ValueChanged<String?> onTag;\n""",
              'task filter loadLimit callback field',
          )
          text = replace_once(
              text,
              """    required this.selectedRange,\n    required this.activeTasks,\n    required this.selectedStatus,\n""",
              """    required this.selectedRange,\n    required this.activeTasks,\n    required this.loadLimit,\n    required this.selectedStatus,\n""",
              'task filter loadLimit constructor',
          )
          text = replace_once(
              text,
              """    required this.onDateRange,\n    required this.onStatus,\n    required this.onTag,\n""",
              """    required this.onDateRange,\n    required this.onStatus,\n    required this.onLoadLimit,\n    required this.onTag,\n""",
              'task filter loadLimit constructor callback',
          )
          text = replace_once(
              text,
              """    return WhiteCard(\n      child: Column(\n""",
              """    return WhiteCard(\n      padding: const EdgeInsets.all(10),\n      child: Column(\n""",
              'compact filter card padding',
          )
          text = replace_once(
              text,
              """            style: const TextStyle(\n              fontSize: AppTextSize.s17,\n              fontWeight: FontWeight.w800,\n            ),\n          ),\n          const SizedBox(height: 10),\n          if (widget.activeTasks)\n            Container(\n              padding: const EdgeInsets.all(12),\n              decoration: BoxDecoration(\n                color: AppColours.greenSoft,\n                borderRadius: BorderRadius.circular(12),\n              ),\n              child: Row(\n                children: [\n                  const Icon(\n                    Icons.event_available_rounded,\n                    color: AppColours.green,\n                  ),\n                  const SizedBox(width: 9),\n                  Expanded(\n                    child: Text(\n                      text.t('Only the next 3 pending active Tasks are loaded.'),\n                      style: const TextStyle(fontWeight: FontWeight.w700),\n                    ),\n                  ),\n                ],\n              ),\n            )\n          else ...[\n""",
              """            style: const TextStyle(\n              fontSize: AppTextSize.s15,\n              fontWeight: FontWeight.w800,\n            ),\n          ),\n          const SizedBox(height: 8),\n          if (widget.activeTasks)\n            Row(\n              children: [\n                Expanded(\n                  child: DropdownButtonFormField<int>(\n                    value: widget.loadLimit,\n                    decoration: InputDecoration(\n                      labelText: text.t('Tasks'),\n                      border: const OutlineInputBorder(),\n                      isDense: true,\n                      contentPadding: const EdgeInsets.symmetric(\n                        horizontal: 12,\n                        vertical: 10,\n                      ),\n                    ),\n                    items: List.generate(10, (index) {\n                      final value = index + 1;\n                      return DropdownMenuItem<int>(\n                        value: value,\n                        child: Text('$value'),\n                      );\n                    }),\n                    onChanged: (value) {\n                      if (value != null) widget.onLoadLimit(value);\n                    },\n                  ),\n                ),\n                const SizedBox(width: 8),\n                SizedBox(\n                  height: 44,\n                  child: FilledButton.icon(\n                    onPressed: widget.onLoad,\n                    icon: const Icon(Icons.refresh_rounded, size: 18),\n                    label: Text(text.t('Load')),\n                  ),\n                ),\n              ],\n            )\n          else ...[\n""",
              'compact active task selector',
          )

          tag_and_load_pattern = re.compile(
              r"          const SizedBox\(height: 10\),\n"
              r"          DropdownButtonFormField<String\?>\(.*?"
              r"          PrimaryButton\(\n"
              r"            text: 'Load Tasks',\n"
              r"            icon: Icons\.refresh_rounded,\n"
              r"            onPressed: widget\.onLoad,\n"
              r"          \),\n",
              re.S,
          )
          match = tag_and_load_pattern.search(text)
          if not match:
              raise SystemExit('missing expected pattern: tag/load filter block')
          original = match.group(0)
          indented = ''.join('  ' + line if line.strip() else line for line in original.splitlines(True))
          replacement = "          if (!widget.activeTasks) ...[\n" + indented + "          ],\n"
          text = text[:match.start()] + replacement + text[match.end():]

          text = replace_once(
              text,
              """              widget.activeTasks\n                  ? 'Change Tag, then tap Load Tasks.'\n                  : 'Changing a filter does not reload until u tap Load Tasks.',\n""",
              """              widget.activeTasks\n                  ? 'Choose 1–10 Tasks, then tap Load.'\n                  : 'Changing a filter does not reload until u tap Load Tasks.',\n""",
              'active task helper text',
          )
          path.write_text(text)
          PY

      - name: Commit focused v333 follow-up
        shell: bash
        run: |
          git config user.name 'OpenAI Automation'
          git config user.email 'openai-automation@users.noreply.github.com'
          git add lib/screens/home_screen.dart lib/screens/main_shell.dart lib/screens/task_hub_screen.dart lib/screens/tasks_screen.dart
          git commit -m 'frontend v333: refine task loading and tab motion'
          git push origin HEAD:frontend-v333-task-home-intelligence
